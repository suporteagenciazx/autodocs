<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | AutoDocs</title>
    <link rel="icon" href="../sistema/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../estilos/sistema.css">
    <link rel="stylesheet" href="../estilos/exportar.css">
    <link rel="stylesheet" href="../estilos/autodocs-hub.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"/>
    <link rel="stylesheet" href="../estilos/icones.css">
    <style>
        .usuarios-doc-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 0 0 14px 0;
        }

        .usuarios-doc-toolbar .doc-hub-search-wrap {
            flex: 1;
            min-width: 200px;
            max-width: 360px;
        }

        .usuarios-msg {
            color: #b00020;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            margin: 0 0 12px;
            min-height: 1.2em;
        }

        .usuarios-email-cell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .usuarios-email-cell .material-symbols-rounded {
            font-size: 20px;
            color: var(--cor-accent);
            flex-shrink: 0;
        }

        .usuarios-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .usuarios-modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }

        .usuarios-modal-bg.is-open {
            display: flex;
        }

        .usuarios-modal {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #eee;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .usuarios-modal h3 {
            margin: 0 0 14px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--cinza-titulos);
        }

        .usuarios-modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="conteudo">
        <header id="pagina">
            <span id="sistema-banco" class="banco-razaosocial"></span>
            <span id="sistema-cnpj" class="banco-cnpj"></span>
        </header>
        <div class="sistema-pagina">
            <div class="doc-hub-layout">
                <h1>Usuários</h1>
                <div class="sistema-conteudo">
                    <p id="usuarios-msg" class="usuarios-msg" role="alert"></p>
                    <div class="doc-hub-toolbar usuarios-doc-toolbar">
                        <label class="doc-hub-search-wrap">
                            <span class="material-symbols-rounded" aria-hidden="true">search</span>
                            <input type="search" id="usuarios-search" placeholder="Pesquisar por email ou função…" autocomplete="off" enterkeyhint="search">
                        </label>
                        <button type="button" id="usuarios-btn-novo" class="autodocs-btn-pill-primary">Novo utilizador</button>
                    </div>
                    <div class="tags-table-wrap">
                        <table class="tags-doc-table" id="usuarios-table">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Função</th>
                                    <th>Ativo</th>
                                    <th>Tags</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="usuarios-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="usuarios-modal-bg" id="usuarios-modal-bg" aria-hidden="true">
        <div class="usuarios-modal" role="dialog" aria-labelledby="usuarios-modal-title">
            <h3 id="usuarios-modal-title">Utilizador</h3>
            <form id="usuarios-form" class="base-boxcampos">
                <input type="hidden" id="usuarios-edit-id" value="">
                <div class="campo">
                    <label class="label-campo" for="usuarios-f-email">Email</label>
                    <input class="input" type="email" id="usuarios-f-email" required maxlength="255" autocomplete="off">
                </div>
                <div class="campo">
                    <label class="label-campo" for="usuarios-f-password">Palavra-passe</label>
                    <div class="password-field-wrap">
                        <input class="input" type="password" id="usuarios-f-password" autocomplete="new-password" placeholder="Deixe vazio para não alterar">
                        <button type="button" class="password-toggle-btn" aria-label="Mostrar palavra-passe" aria-pressed="false">
                            <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="campo">
                    <label class="label-campo" for="usuarios-f-role">Função</label>
                    <select class="input" id="usuarios-f-role">
                        <option value="user">Utilizador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="usuarios-modal-actions">
                    <button type="submit" class="autodocs-btn-pill-primary" style="flex:1;min-width:140px;">Guardar</button>
                    <button type="button" id="usuarios-modal-cancel" class="autodocs-btn-pill-secondary" style="flex:1;min-width:140px;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="usuarios-docs-modal-bg" id="usuarios-docs-modal-bg" aria-hidden="true">
        <div class="usuarios-docs-modal" role="dialog" aria-labelledby="usuarios-docs-modal-title">
            <div class="usuarios-docs-modal-header">
                <div>
                    <h3 id="usuarios-docs-modal-title">Vincular tags</h3>
                    <p class="usuarios-docs-modal-sub" id="usuarios-docs-modal-sub"></p>
                </div>
                <button type="button" id="usuarios-docs-close-top" class="tags-btn-outline" aria-label="Fechar">Fechar</button>
            </div>
            <div class="usuarios-docs-toolbar">
                <label class="doc-hub-search-wrap">
                    <span class="material-symbols-rounded" aria-hidden="true">search</span>
                    <input type="search" id="usuarios-docs-search" placeholder="Pesquisar tag…" autocomplete="off">
                </label>
                <div class="usuarios-docs-view-toggle" role="group" aria-label="Modo de visualização">
                    <button type="button" class="usuarios-docs-view-btn is-active" data-view="cards" aria-pressed="true" title="Cartões">
                        <span class="material-symbols-rounded" aria-hidden="true">grid_view</span>
                    </button>
                    <button type="button" class="usuarios-docs-view-btn" data-view="list" aria-pressed="false" title="Lista">
                        <span class="material-symbols-rounded" aria-hidden="true">view_list</span>
                    </button>
                </div>
            </div>
            <p id="usuarios-docs-modal-msg" class="usuarios-docs-modal-msg" role="alert" hidden></p>
            <div class="usuarios-docs-body">
                <div id="usuarios-docs-container" class="usuarios-docs-grid"></div>
            </div>
            <div class="usuarios-docs-modal-footer">
                <button type="button" id="usuarios-docs-close" class="tags-btn-primary">Concluído</button>
            </div>
        </div>
    </div>

    <script src="../scripts/banco.js"></script>
    <script src="../scripts/autodocs-tags-storage.js?v=5"></script>
    <script src="../scripts/autodocs-docs-catalog.js"></script>
    <script src="../scripts/password-toggle.js"></script>
    <script src="../scripts/navdrawer.js"></script>
    <script src="../scripts/usuarios-page.js?v=5"></script>
</body>

</html>
