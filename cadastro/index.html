<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | AutoDocs</title>
    <link rel="icon" href="../sistema/favicon.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="../estilos/fontes/inter.css?v=20260905">
    <link rel="stylesheet" href="../estilos/sistema.css?v=20260905">
    <link rel="stylesheet" href="../estilos/exportar.css?v=20260905">
    
    <link rel="stylesheet" href="../estilos/icones.css?v=20260905">
    <style>
        .autodocs-auth-card { max-width: 420px; margin: 0 auto; }
        .autodocs-auth-msg { color: #b00020; font-size: 13px; margin: 0 0 12px; min-height: 1.2em; }
        .autodocs-auth-ok { color: #1b5e20; font-size: 13px; margin: 0 0 12px; }
        .autodocs-auth-note { font-size: 12px; color: #555; margin-top: 12px; }
        .autodocs-pin-once { font-size: 28px; letter-spacing: 0.35em; font-weight: 700; font-family: ui-monospace, monospace; margin: 8px 0 12px; }
    </style>
</head>

<body>
    <div class="conteudo">
        <header id="pagina">
            <span id="sistema-banco" class="banco-razaosocial"></span>
            <span id="sistema-cnpj" class="banco-cnpj"></span>
        </header>
        <div class="sistema-pagina">
            <h1>Criar conta</h1>
            <div class="formularios">
                <div class="area-boxes" style="grid-template-columns: 1fr;">
                    <div class="base-box autodocs-auth-card">
                        <div class="box-header">
                            <span class="material-symbols-rounded">person_add</span>
                            <h2>Registo</h2>
                        </div>
                        <p id="cadastro-msg" class="autodocs-auth-msg" role="alert"></p>
                        <p id="cadastro-ok" class="autodocs-auth-ok" hidden></p>
                        <p id="cadastro-pin-wrap" class="autodocs-auth-ok" hidden>
                            O seu PIN (guarde agora — não será mostrado outra vez):
                            <span id="cadastro-pin" class="autodocs-pin-once"></span>
                        </p>
                        <p id="cadastro-bloqueado" class="campo-texto" hidden>
                            O registo público está desativado. Peça a um administrador para criar a sua conta.
                        </p>
                        <form id="form-cadastro" class="base-boxcampos" hidden>
                            <div class="campo">
                                <label class="label-campo" for="cadastro-email">Email</label>
                                <input class="input" type="email" id="cadastro-email" name="email" required autocomplete="username" maxlength="255">
                            </div>
                            <div class="campo" style="margin-top: 8px;">
                                <button type="submit" class="autodocs-btn-pill-primary" style="width:100%;">Registar</button>
                            </div>
                        </form>
                        <p class="autodocs-auth-note"><a href="../login/">Voltar ao login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/banco.js?v=20260905"></script>
    <script src="../scripts/cadastro-page.js?v=20260907"></script>
    <script src="../scripts/navdrawer.js?v=20260905"></script>
</body>

</html>
