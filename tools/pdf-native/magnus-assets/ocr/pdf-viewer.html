<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html,body{margin:0;background:#333}
  #wrap{display:flex;flex-direction:column;gap:16px;align-items:center;padding:16px}
  canvas{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="wrap"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async () => {
  const url = "file:///c:/Users/EMPRESARIAL/Desktop/MAGNUS%20VALUATION/Laudo%20de%20avalia%C3%A7%C3%A3o%20econ%C3%B4mica%20MAGNUS.pdf";
  const doc = await pdfjsLib.getDocument(url).promise;
  window.__pageCount = doc.numPages;
  const wrap = document.getElementById('wrap');
  const scale = 2.0;
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.dataset.page = String(i);
    wrap.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }
  window.__ready = true;
})().catch(e => { window.__error = String(e); });
</script>
</body>
</html>
