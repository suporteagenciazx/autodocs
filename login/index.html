<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | AutoDocs</title>
    <link rel="icon" href="../sistema/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../estilos/fontes/inter.css?v=20260905">
    <link rel="stylesheet" href="../estilos/sistema.css?v=20260908c">
    <link rel="stylesheet" href="../estilos/exportar.css?v=20260905">
    <link rel="stylesheet" href="../estilos/icones.css?v=20260905">
    <link rel="stylesheet" href="../estilos/autodocs-lock.css?v=20260905">
</head>

<body class="login-standalone">
    <main class="login-standalone-main">
        <form id="form-login" class="login-standalone-card base-boxcampos" novalidate>
            <img id="login-logo" class="login-standalone-logo" src="../sistema/logo-horizontal.svg" alt="AutoDocs" width="160" height="44">
            <p id="login-msg" class="autodocs-auth-msg" role="alert"></p>
            <div class="campo">
                <label class="label-campo" for="login-email">Email</label>
                <input class="input" type="email" id="login-email" name="email" required autocomplete="username" maxlength="255">
            </div>
            <div class="campo">
                <label class="label-campo" for="login-pin-0">PIN</label>
                <div class="autodocs-pin-row" id="login-pin-row" data-pin-length="6">
                    <input class="autodocs-pin-box" id="login-pin-0" type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1">
                    <input class="autodocs-pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 2">
                    <input class="autodocs-pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 3">
                    <input class="autodocs-pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 4">
                    <input class="autodocs-pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 5">
                    <input class="autodocs-pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 6">
                </div>
            </div>
            <button type="submit" class="login-standalone-submit">Entrar</button>
        </form>
    </main>
    <script src="../scripts/autodocs-pin-input.js?v=20260905"></script>
    <script src="../scripts/login-page.js?v=20260908f"></script>
    <script src="../scripts/autodocs-css-guard.js?v=20260905"></script>
</body>

</html>
