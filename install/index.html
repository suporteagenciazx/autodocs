<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalação | AutoDocs</title>
    <link rel="icon" href="../sistema/favicon.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="../estilos/fontes/inter.css?v=20260905">
    <link rel="stylesheet" href="../estilos/sistema.css?v=20260908c">
    <link rel="stylesheet" href="../estilos/exportar.css?v=20260905">
    
    <link rel="stylesheet" href="../estilos/icones.css?v=20260905">
    <style>
        .autodocs-auth-card { max-width: 440px; margin: 0 auto; }
        .autodocs-auth-msg { color: #b00020; font-size: 13px; margin: 0 0 12px; min-height: 1.2em; }
        .autodocs-auth-ok { color: #1b5e20; font-size: 13px; margin: 0 0 12px; }
        .autodocs-auth-note { font-size: 12px; color: #555; margin-top: 12px; }
        .autodocs-pin-once { font-size: 28px; letter-spacing: 0.35em; font-weight: 700; font-family: ui-monospace, monospace; margin: 8px 0 12px; }
    </style>
</head>

<body>
    <div class="conteudo">
        <header id="pagina">
            <span id="sistema-banco" class="banco-razaosocial"></span>
            <span id="sistema-cnpj" class="banco-cnpj"></span>
        </header>
        <div class="sistema-pagina">
            <h1>Primeira instalação</h1>
            <div class="formularios">
                <div class="area-boxes" style="grid-template-columns: 1fr;">
                    <div class="base-box autodocs-auth-card">
                        <div class="box-header">
                            <span class="material-symbols-rounded">admin_panel_settings</span>
                            <h2>Criar administrador</h2>
                        </div>
                        <p class="campo-texto" style="margin-bottom: 12px;">
                            Só é permitido quando ainda não existe nenhum utilizador. Será gerado um <strong>PIN de 6 dígitos</strong> (único meio de login).
                        </p>
                        <p id="install-msg" class="autodocs-auth-msg" role="alert"></p>
                        <p id="install-ok" class="autodocs-auth-ok" hidden></p>
                        <p id="install-pin-wrap" class="autodocs-auth-ok" hidden>
                            O seu PIN (guarde agora — não será mostrado outra vez):
                            <span id="install-pin" class="autodocs-pin-once"></span>
                        </p>
                        <form id="form-install" class="base-boxcampos">
                            <div class="campo">
                                <label class="label-campo" for="install-email">Email do administrador</label>
                                <input class="input" type="email" id="install-email" name="email" required autocomplete="username" maxlength="255">
                            </div>
                            <div class="campo" style="margin-top: 8px;">
                                <button type="submit" class="autodocs-btn-pill-primary" style="width:100%;">Criar e entrar</button>
                            </div>
                        </form>
                        <p class="autodocs-auth-note"><a href="../login/">Ir para o login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/banco.js?v=20260905"></script>
    <script src="../scripts/install-page.js?v=20260907"></script>
    <script src="../scripts/navdrawer.js?v=20260908c"></script>
</body>

</html>
