<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentações | AutoDocs</title>

    <link rel="icon" href="../sistema/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../estilos/fontes/inter.css?v=20260905">
    <link rel="stylesheet" href="../estilos/sistema.css?v=20260905">
    <link rel="stylesheet" href="../estilos/exportar.css?v=20260905">
    <link rel="stylesheet" href="../estilos/autodocs-hub.css?v=20260905">
    
    <link rel="stylesheet" href="../estilos/icones.css?v=20260905">
    <script src="../scripts/autodocs-page-transition-boot.js?v=20260905"></script>
</head>

<body>
    <div class="conteudo">
        <header id="pagina">
            <span id="sistema-banco" class="banco-razaosocial"></span>
            <span id="sistema-cnpj" class="banco-cnpj"></span>
        </header>
        <div class="sistema-pagina">
            <div class="doc-hub-layout">
            <h1>Documentações</h1>
            <div class="sistema-conteudo">
                <div class="doc-hub-toolbar">
                    <label class="doc-hub-search-wrap">
                        <span class="material-symbols-rounded" aria-hidden="true">search</span>
                        <input type="search" id="documentacoes-search" placeholder="Pesquisar por nome, instituição ou descrição…" autocomplete="off" enterkeyhint="search">
                    </label>
                    <div class="doc-hub-tag-filter">
                        <span class="doc-hub-tag-filter-label" id="documentacoes-tag-filter-label">Etiqueta</span>
                        <div id="documentacoes-tag-filter" class="doc-hub-tag-multiselect" role="group" aria-labelledby="documentacoes-tag-filter-label"></div>
                    </div>
                    <div class="doc-hub-toolbar-actions" id="documentacoes-admin-tools" hidden>
                        <button type="button" id="documentacoes-group-toggle" class="tags-btn-outline doc-hub-group-toggle" aria-pressed="false" title="Agrupar documentações por etiqueta">
                            <span class="material-symbols-rounded" aria-hidden="true">view_agenda</span>
                            Agrupar por etiqueta
                        </button>
                    </div>
                </div>
                <p id="documentacoes-empty" class="doc-hub-empty" hidden>Nenhuma documentação encontrada.</p>
                <div id="documentacoes-list" class="doc-hub-list">
                    <div id="documentacoes-grid" class="doc-hub-grid"></div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <script src="../scripts/banco.js?v=20260905"></script>
    <script src="../scripts/autodocs-tags-storage.js?v=20260905"></script>
    <script src="../scripts/navdrawer.js?v=20260908"></script>
    <script src="../scripts/autodocs-docs-catalog.js?v=20260905"></script>
    <script src="../scripts/designer-models-storage.js?v=20260905"></script>
    <script src="../scripts/documentacoes-page.js?v=20260908b"></script>
</body>

</html>
